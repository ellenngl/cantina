<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="IMG/favicon.ico" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            padding:20px;
            display:block;
             background-color:rgb(237, 253, 224);
            color:#000000;
        }
        #Titulo{
            color: gold;
        }
        .dashboard{
            max-width:1200px;
            margin:auto;
            color: white;
            background-color:rgb(80, 196, 45);
        }
        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
            color:saddlebrown;
        }

        .card{
            background:white;
            padding: 2px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            color:blueviolet;
        }

        #avaliacoesPositivas{
            margin-left: 20px;
        }

        #avaliacoesMedianas{
            margin-left: 20px;
        }

        #avaliacoesNegativas{
            margin-left: 20px;
        }


        .card h2{
            margin-left: 20px;
            font-size:1rem;
            margin-bottom:10px;
            color: black;
            background-color: white;
        }

        .numero{
            font-size:2rem;
            font-weight:bold;
            color:#0f2e11;;
        }

        .grafico-container{
            background:rgb(255, 244, 244);
            background-color: white;
            padding:20px;
            border-radius:10px;
            margin-bottom:30px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            color:rgb(0, 0, 0);
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 2px 8px black;
        }

        th, td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
            color: black;
            background-color: white;
        }

        th{
            background:#797979;
            color: black;
            background-color: #84D452;
        }
        #graficoQualidade{
            background-color:rgb(216, 189, 66);
        }
        #tabelaDados{
            background-color:black;
            color:black;
        }
      
    </style>
</head>
<body>

<div class="dashboard">

    <h1 id="Titulo">Painel do Refeitório</h1>

    <div class="cards">
        <div class="card">
            <h2>Avaliações Positivas:</h2>
            <div class="numero" id="avaliacoesPositivas">0</div>
        </div>
    </div>
    <div class="cards">
        <div class="card">
            <h2>Avaliações Medianas:</h2>
            <div class="numero" id="avaliacoesMedianas">0</div>
        </div>
    </div>
    <div class="cards">
        <div class="card">
            <h2>Avaliações Negativas:</h2>
            <div class="numero" id="avaliacoesNegativas">0</div>
        </div>
    </div>

    <div class="grafico-container">

    <h2>Selecionar Data</h2>

    <input type="date" id="filtroData">

    <button onclick="filtrar()" id="botaoFiltrar">Buscar</button>

</div>

    <div class="grafico-container">
        <canvas id="graficoQualidade"></canvas>
    </div>

    <h2 style="margin-bottom:15px;">Respostas Registradas</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Qualidade</th>
                <th>Data</th>
            </tr>
        </thead>

        <tbody id="tabelaDados"></tbody>
    </table>

        <h2 style="margin-top:30px;">Reclamações Registradas</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Reclamação</th>
            <th>Data</th>
        </tr>
    </thead>

    <tbody id="tabelaReclamacoes"></tbody>
</table>
</div>


<script> //se o admin não estiver logado, redireciona para a página de login, se estiver logado, carrega o relatório normalmente
    if(localStorage.getItem('adminLogado') !== 'true'){

    window.location.href = 'login.html';

}

async function carregarRelatorio(data=''){

   const response = await fetch(`http://localhost:3000/api/relatorio?data=${data}`);

    const dados = await response.json();
 
    let positivas = 0;
    let negativas = 0;
    let medianas = 0;

    let Pessimo = 0;
    let Ruim = 0;
    let Eh = 0;
    let Bom = 0;
    let Excelente = 0;

    const tabela = document.getElementById('tabelaDados');

    tabela.innerHTML = '';

    dados.forEach(item => {
        if(item.qualidade_comida === 'Excelente'){
            Excelente++;
            positivas++;
        }

        if(item.qualidade_comida === 'Bom'){
            Bom++;
            positivas++;
        }

        if(item.qualidade_comida === 'Eh'){
            Eh++;
            medianas++;
        }

        if(item.qualidade_comida === 'Ruim'){
            Ruim++;
            negativas++;
        }

        if(item.qualidade_comida === 'Pessimo'){
            Pessimo++;
            negativas++;
        }

       //pega os dados do banco e exibe na tabela
        tabela.innerHTML +=  ` 
            <tr> 
                <td>${item.id}</td>
                <td>${item.qualidade_comida}</td>
                <td>${item.data_registro}</td>
            </tr>
        `;
    });

    document.getElementById('avaliacoesPositivas').textContent = positivas;
    document.getElementById('avaliacoesMedianas').textContent = medianas;
    document.getElementById('avaliacoesNegativas').textContent = negativas;
    new Chart(document.getElementById('graficoQualidade'), {
        type:'bar',
        data:{
            labels:['Pessimo','Ruim','Eh','Bom','Excelente'],
            datasets:[{
                label:'Qualidade da Comida',
                data:[Pessimo,Ruim,Eh,Bom,Excelente]
            }]
        }
    });

}
function filtrar(){

    const data = document.getElementById('filtroData').value;

    carregarRelatorio(data);

}
async function carregarReclamacoes(data=''){
    const response = await fetch(`http://localhost:3000/api/relatorio-reclamacoes?data=${data}`);
    const dadosReclamacoes = await response.json();

    const tabelaReclamacoes = document.getElementById('tabelaReclamacoes');
    tabelaReclamacoes.innerHTML = '';

    dadosReclamacoes.forEach(item => {
        tabelaReclamacoes.innerHTML += ` 
            <tr> 
                <td>${item.id}</td>
                <td>${item.reclamacao}</td>
                <td>${item.data_registro}</td>
            </tr>
        `;
    });
}


</script>

</body>
</html>
