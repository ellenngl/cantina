<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Refeitório - Pesquisa</title>
    <link rel="icon" href="IMG/favicon.ico" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabeçalho">
        <img  id="ceara" src="IMG/ceara.png">
        <img id="maca" src="IMG/maça.png">
        <h1 id="titulo"> NUTRI-AVALIA</h1>
        <p id="subtitulo">Sua participação é importante!</p>
    </header>
    <div id="avaliaçao-almoço">
        <h2 id="aa">AVALIE SEU ALMOÇO</h2>
    </div>
    <div class="bordaCardapio">
        <div class="almoco">
        <h2>CARDAPIO 18/06</h2>
        <ul class="cardapio">
            <li> Farofa</li>
            <li> Salada</li>
            <li> Suco</li>
            <li> Fruta</li>
        </ul>
        </div>
        <div class="almoco2">
        <ul>
            <li> Arroz </li>
            <li> Macarrão</li>
            <li> Carne de porco (cozida)</li>
            <li> Feijão</li>
        </ul>
        </div>
    </div>
    <div class="container">
        <form id="feedbackForm">
     <div class="avaliacao">

    <input type="radio" name="qualidade_comida" id="Pessimo" value="Pessimo" required>
    <label for="Pessimo">
        <img src="img/pessimo.png" alt="Péssimo">
        <span id="red">Péssimo</span>
    </label>

    <input type="radio" name="qualidade_comida" id="Ruim" value="Ruim">
    <label for="Ruim">
        <img src="img/ruim.png" alt="Ruim">
        <span id="orange">Ruim</span>
    </label>

    <input type="radio" name="qualidade_comida" id="Eh" value="Eh">
    <label for="Eh">
        <img src="img/eh.png" alt="Eh">
        <span id="yellow">Eh...</span>
    </label>

    <input type="radio" name="qualidade_comida" id="Bom" value="Bom">
    <label for="Bom">
        <img src="img/bom.png" alt="Bom">
        <span id="blue">Bom</span>
    </label>

    <input type="radio" name="qualidade_comida" id="Excelente" value="Excelente">
    <label for="Excelente">
        <img src="img/excelente.png" alt="Excelente">
        <span id="green">Excelente</span>
    </label>

</div>
     <button id="enviar" type="submit">ENVIAR</button>
        </form>
    </div>
    <a href="reclamaçao.html" id="qrcode"><img src="IMG/qrcode.png" alt="QR Code"></a>
    <img src="IMG/texto.png" id="texto">
