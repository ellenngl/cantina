<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Refeitório - Pesquisa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
       <header id="cabeçalho">
        <h1>NUTRIAVALIA</h1>
        <P>Sua participação é importante!</P>
    </header>
    <div class="container">
        <h1>Pesquisa do Refeitório </h1>
        <form id="feedbackForm">
            <h3>Como estava a qualidade da comida ontem?</h3>
            <select id="qualidade_comida" required>
                <option value="Pessimo">Péssimo</option>
                <option value="Ruim">Ruim</option>
                <option value="Eh">Eh...</option>
                <option value="Bom">Bom</option>
                <option value="Excelente">Excelente</option>
            </select>

            <button type="submit">Enviar Resposta</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
