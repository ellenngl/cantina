<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Reclamação - Pesquisa</title>
    <link rel="icon" href="IMG/favicon.ico" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabeçalho">
        <img  id="ceara" src="IMG/ceara.png">
        <img id="maca" src="IMG/maça.png">
        <h1 id="titulo"> NUTRI-AVALIA</h1>
        <p id="subtitulo">Sua participação é importante!</p>
    </header>
    <div id="avaliaçao-almoço">
        <h2 id="aa">AVALIE SEU ALMOÇO</h2>
    </div>
    <div class="bordaCardapio">
        <div class="almoco">
        <h2>CARDAPIO 18/06</h2>
        <ul class="cardapio">
            <li> Farofa</li>
            <li> Salada</li>
            <li> Suco</li>
            <li> Fruta</li>
        </ul>
        </div>
        <div class="almoco2">
        <ul>
            <li> Arroz </li>
            <li> Macarrão</li>
            <li> Carne de porco (cozida)</li>
            <li> Feijão</li>
        </ul>
        </div>
    </div>
    <form id="reclamacaoForm">
    <input id="textoReclamacao" name="reclamacao" placeholder="RECLAME AQUI..." required>
    <br>
    <button id="enviarRecla" type="submit">ENVIAR</button>
    <br>
    <a href="avaliaçao.html" id="voltarRecla">Voltar ao início</a>
</form>
    
<script src="script.js"></script>
</body>
</html>
